name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1) Isometric commit calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: svg/metrics.plugin.isocalendar.svg
          base: ""

          plugin_isocalendar: yes

      # 2) Coding habits and activity
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: svg/metrics.plugin.habits.svg
          base: ""

          plugin_habits: yes
          plugin_habits_facts: instance
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          
          commits_authoring: .user.login, .author.login, .committer.login
          
          config_timezone: Asia/Ho_Chi_Minh

      # 3) Comment reactions
      - uses: lowlighter/metrics@latest
        with:
          filename: svg/metrics.plugin.reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage

      # Commit
      - name: Commit generated metrics
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update metrics"
          file_pattern: "svg/*.svg"
