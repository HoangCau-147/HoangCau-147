name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1) Isometric commit calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: svg/metrics.plugin.isocalendar.svg
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 2) Coding habits and activity
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: svg/metrics.plugin.habits.svg
          base: ""
  
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_days: 7
          plugin_habits_from: 20
          config_timezone: Asia/Ho_Chi_Minh

      # Commit
      - name: Commit generated metrics
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update metrics"
          file_pattern: "svg/*.svg"
